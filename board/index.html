<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knit Board</title>
<link rel="stylesheet" href="/board.css">
<script type="module" src="/board.js"></script>
</head>
<body>
<div class="wrap">
  <header class="panel top">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path class="mark-a" d="M5 16c0-6 5-10 11-10s11 4 11 10"/><path class="mark-b" d="M27 16c0 6-5 10-11 10S5 22 5 16"/><circle class="mark-c" cx="16" cy="16" r="3.5"/></svg>
      <span class="title">Knit Board</span>
    </div>
    <span class="chip" id="project">connecting…</span>
    <span class="chip" id="mode"></span>
    <span class="chip status"><span class="dot" id="status-dot"></span><span id="status">Waiting for events</span></span>
    <span class="spacer"></span>
    <dl class="stats">
      <div><dt>Elapsed</dt><dd id="elapsed">0m</dd></div>
      <div><dt>Tokens</dt><dd id="tokens">0</dd></div>
      <div><dt>Agents busy</dt><dd id="busy">0</dd></div>
      <div><dt>Tests</dt><dd id="tests">-</dd></div>
    </dl>
    <button class="btn" id="theme" type="button">Dark mode</button>
  </header>

  <section class="panel" aria-labelledby="flow-title">
    <div class="row-head"><h2 id="flow-title">The flow</h2><span class="muted">Files slide along the thread as agents hand them on</span></div>
    <div class="scroll">
      <div class="flow" id="flow">
        <div class="chunk-box"><span id="chunk-label">EACH CHUNK</span></div>
        <div class="rail" id="rail"><span class="thread-dot"></span></div>
        <div class="stations" id="stations"></div>
        <svg class="loop" viewBox="0 0 400 54" preserveAspectRatio="none" aria-hidden="true"><path class="ants" d="M350 2 C350 52 50 52 50 2"/><path d="M44 10 L50 1 L56 10"/></svg>
        <div class="loop-label muted">next chunk starts back at Design</div>
      </div>
    </div>
  </section>

  <div class="split">
    <section class="panel now" aria-labelledby="now-title">
      <div class="row-head"><h2 id="now-title">Now</h2><span class="muted" id="now-msg"></span></div>
      <div class="agents" id="now-agents"></div>
      <div class="tokens" id="token-bars"></div>
    </section>
    <aside class="panel feed" aria-labelledby="feed-title">
      <div class="row-head"><h2 id="feed-title"><span class="dot live"></span>Live activity</h2></div>
      <ol id="feed" aria-live="polite"></ol>
    </aside>
  </div>
</div>
</body>
</html>
